<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Base -->
  <rect width="512" height="512" rx="100" fill="url(#grad1)" />
  
  <!-- Cash Register Body -->
  <rect x="76" y="110" width="360" height="290" rx="28" fill="#ffffff" />
  
  <!-- Digital Screen Display -->
  <rect x="106" y="140" width="300" height="85" rx="14" fill="url(#screenGrad)" />
  <!-- Screen Text / Numbers -->
  <text x="380" y="195" fill="#10b981" font-family="monospace, sans-serif" font-size="34" font-weight="bold" text-anchor="end">රු. 1,500.00</text>
  <text x="125" y="170" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="bold">TOTAL</text>
  
  <!-- Keypad Grid -->
  <!-- Row 1 -->
  <rect x="106" y="245" width="60" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="186" y="245" width="60" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="266" y="245" width="60" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="346" y="245" width="60" height="42" rx="8" fill="#2563eb" />
  <text x="376" y="272" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">+</text>

  <!-- Row 2 -->
  <rect x="106" y="300" width="60" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="186" y="300" width="60" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="266" y="300" width="60" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="346" y="300" width="60" height="42" rx="8" fill="#f59e0b" />
  <text x="376" y="327" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">CLR</text>

  <!-- Row 3 Cash Drawer Base -->
  <rect x="106" y="354" width="220" height="34" rx="8" fill="#e2e8f0" />
  <rect x="346" y="354" width="60" height="34" rx="8" fill="#10b981" />
  <text x="376" y="377" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">PAY</text>
  
  <!-- Cash Slot -->
  <rect x="176" y="367" width="80" height="8" rx="4" fill="#64748b" />
</svg>
